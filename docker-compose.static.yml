version: '3.8'

# Simplified Docker Compose for VacCOVID with Mock API
# No database needed - all data is embedded in mockApi.js

services:
  vaccovid:
    build:
      context: .
      dockerfile: Dockerfile.static
    container_name: vaccovid-static
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
